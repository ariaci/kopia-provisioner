name: Release

on:
  push:
    tags:
      - "v*"

env:
  KOPIA_VERSION: 0.23.1
  GO_VERSION: "1.26.1"
  OUTPUT_BASE_NAME: "kopia-provisioner-${{ github.ref_name }}"
  CONTAINER_REGISTRY: "ghcr.io/${{ github.repository }}"
  IMAGE_DESCRIPTION: "Declarative user management for Kopia servers"
  IMAGE_BASE_TAG: "${{ github.ref_name }}-kopia-"
  IMAGE_LATEST_BASE_TAG: "latest-kopia-"

permissions:
  contents: write

jobs:
  license:
    name: Source Archives
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Go tools
        run: go install github.com/google/go-licenses/v2@latest

      - name: Generate license files
        run: |
          go mod download
          go-licenses save ./... --save_path .build/${{ env.OUTPUT_BASE_NAME }}/kopia-provisioner --force
          cd tools/genversioninfo
          go mod download
          go-licenses save ./... --save_path ../../.build/${{ env.OUTPUT_BASE_NAME }}/tools/genversioninfo --force

      - name: Create tar.gz
        run: |
          cd .build
          tar -czf ${OUTPUT_BASE_NAME}-licenses.tar.gz ${OUTPUT_BASE_NAME}/

      - name: Create zip
        run: |
          cd .build
          zip -r ${OUTPUT_BASE_NAME}-licenses.zip ${OUTPUT_BASE_NAME}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: |
            .build/${{ env.OUTPUT_BASE_NAME }}-licenses.zip
            .build/${{ env.OUTPUT_BASE_NAME }}-licenses.tar.gz

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [license]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        goos: [linux, windows, darwin]
        goarch: [amd64, 386, arm64, arm]

        include:
          # Friendly names
          - goarch: amd64
            archname: x64
          - goarch: 386
            archname: x86
          # Windows extension
          - goos: windows
            goext: .exe
            archive: .zip
            
        exclude:
          # Windows does not support arm 32-bit
          - goos: windows
            goarch: arm
          # Darwin supports only 64-bit
          - goos: darwin
            goarch: 386
          - goos: darwin
            goarch: arm
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compute essential build environment variables
        run: |
          echo "ARTIFACT_NAME=${{ env.OUTPUT_BASE_NAME }}-${{ matrix.goos }}-${{ matrix.archname || matrix.goarch }}" >> $GITHUB_ENV
      - name: Compute essential docker image environment variables
        run: |
          echo "IMAGE_TAG=${{ env.IMAGE_BASE_TAG }}${{ env.KOPIA_VERSION }}-${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "IMAGE_ARTIFACT_NAME=${{ env.ARTIFACT_NAME }}.kopia-${{ env.KOPIA_VERSION }}.dockerimage" >> $GITHUB_ENV

      - name: Generate files
        run: go generate ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o .build/artifacts/${{ env.OUTPUT_BASE_NAME }}/${{ env.ARTIFACT_NAME }}${{ matrix.goext }}

      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: .build/

      - name: Add licenses
        run: |
          cd .build
          unzip *-licenses.zip -d ./licenses
          mkdir -p artifacts/${{ env.OUTPUT_BASE_NAME }}/licenses
          mv ./licenses/*/* ./artifacts/${{ env.OUTPUT_BASE_NAME }}/licenses

      - name: Package artifacts
        if: ${{ matrix.archive == '.zip' }}
        run: |
          cd .build/artifacts
          zip -r ../${{ env.ARTIFACT_NAME }}.zip ./
      - name: Package artifacts
        if: ${{ matrix.archive != '.zip' }}
        run: |
          cd .build/artifacts
          tar -czf ../${{ env.ARTIFACT_NAME }}.tar.gz ${{ env.OUTPUT_BASE_NAME }}

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Prepare Docker-image contents
        if: ${{ matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64') }}
        run: |
          mkdir -p .build/docker/usr/local/bin
          mv .build/artifacts/${{ env.OUTPUT_BASE_NAME }}/${{ env.ARTIFACT_NAME }}${{ matrix.goext }} .build/docker/usr/local/bin/kopia-provisioner
          mkdir -p .build/docker/usr/share/licenses/kopia-provisioner
          mv .build/artifacts/${{ env.OUTPUT_BASE_NAME }}/licenses/* .build/docker/usr/share/licenses/kopia-provisioner
      - name: Create and save Docker-image
        if: ${{ matrix.goos == 'linux' && (matrix.goarch == 'amd64' || matrix.goarch == 'arm64') }}
        run: |
          docker buildx build \
            --platform=linux/${{ matrix.goarch }} \
            --output=type=docker,oci-mediatypes=true,dest=.build/${{ env.IMAGE_ARTIFACT_NAME }}.tar \
            --build-arg KOPIA_VERSION='${{ env.KOPIA_VERSION }}' \
            --label org.opencontainers.image.title='kopia-provisioner' \
            --label org.opencontainers.image.created=$(date +%Y-%m-%dT%H:%M:%SZ%:z) \
            --label org.opencontainers.image.description='${{ env.IMAGE_DESCRIPTION }}' \
            --label org.opencontainers.image.version='${{ github.ref_name }}' \
            --label org.opencontainers.image.revision='${{ github.sha }}' \
            --label org.opencontainers.image.source='${{ github.server_url }}/${{ github.repository }}' \
            --label org.opencontainers.image.url='${{ github.server_url }}/${{ github.repository }}' \
            --label org.opencontainers.image.documentation='${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.MD' \
            --label org.opencontainers.image.licenses='MIT' \
            --label org.opencontainers.image.vendor='${{ github.repository_owner }}' \
            --label org.opencontainers.image.base.name='kopia/kopia:${{ env.KOPIA_VERSION }}' \
            --label org.opencontainers.image.architecture='${{ matrix.goarch }}' \
            --label org.opencontainers.image.os='${{ matrix.goos }}' \
            --tag kopia-provisioner:${{ env.IMAGE_TAG }} \
            .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            .build/${{ env.ARTIFACT_NAME }}.tar.gz
            .build/${{ env.ARTIFACT_NAME }}.zip
      - name: Upload docker image
        uses: actions/upload-artifact@v4
        with:
          name: dockerimage-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            .build/${{ env.IMAGE_ARTIFACT_NAME }}.tar

  docker-images:
    name: Docker Images
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download linux/amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dockerimage-linux-amd64
          path: .build/
      - name: Download linux/arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dockerimage-linux-arm64
          path: .build/

      - name: Compute environment variables
        run: |
          echo "IMAGE_TAG=${{ env.IMAGE_BASE_TAG }}${{ env.KOPIA_VERSION }}" >> $GITHUB_ENV
          echo "IMAGE_LATEST_TAG=${{ env.IMAGE_LATEST_BASE_TAG }}${{ env.KOPIA_VERSION }}" >> $GITHUB_ENV

      - name: Load docker images
        run: |
          docker load -i .build/${{ env.OUTPUT_BASE_NAME }}-linux-x64.kopia-${{ env.KOPIA_VERSION }}.dockerimage.tar
          docker load -i .build/${{ env.OUTPUT_BASE_NAME }}-linux-arm64.kopia-${{ env.KOPIA_VERSION }}.dockerimage.tar
      - name: Retag docker images
        run: |
          docker tag kopia-provisioner:${{ env.IMAGE_TAG }}-amd64 ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-amd64 
          docker tag kopia-provisioner:${{ env.IMAGE_TAG }}-arm64 ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ !env.ACT }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push docker images
        if: ${{ !env.ACT }}
        run: |
          docker push ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-amd64
          docker push ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-arm64
      - name: Build and push multiarch docker image
        if: ${{ !env.ACT }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }} \
            ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-amd64 \
            ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-arm64

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh

      - name: Check for latest tag push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            LATEST=$(gh api /users/${{ github.repository_owner }}/packages/container/kopia-provisioner/versions \
              --jq '.[].metadata.container.tags[]' \
              | grep -E '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}-kopia(\.(0|[1-9][0-9]*)){3}$' \
              | sort -V -r \
              | head -n1)
          else
            LATEST="UNKNOWN"
          fi

          if [ "$LATEST" = "$CONTAINER_TAG" ]; then
            echo "IS_LATEST=true" >> $GITHUB_ENV
          else
            echo "IS_LATEST=false" >> $GITHUB_ENV
          fi

      - name: Push latest tag
        if: env.IS_LATEST == 'true'
        run: |
          if [[ ! -v ACT ]]; then
            docker buildx imagetools create \
              -t ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_LATEST_TAG }} \
              ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-amd64 \
              ${{ env.CONTAINER_REGISTRY }}:${{ env.IMAGE_TAG }}-arm64
          else
            echo "Skipping latest tag push due ACT environment. Please run this workflow in GitHub Actions to push the latest tag."
          fi

  source:
    name: Source Archives
    needs: [license]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare sources
        run: |
          mkdir -p .build
          git archive --format tar --prefix=${{ env.OUTPUT_BASE_NAME }}/ -o .build/${{ env.OUTPUT_BASE_NAME }}-source.tar HEAD
          cd .build
          tar -xf ${{ env.OUTPUT_BASE_NAME }}-source.tar

      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: .build/

      - name: Add licenses
        run: |
          cd .build
          unzip *-licenses.zip -d ./licenses
          mkdir -p ${{ env.OUTPUT_BASE_NAME }}/licenses
          mv ./licenses/*/* ${{ env.OUTPUT_BASE_NAME }}/licenses

      - name: Create tar.gz
        run: |
          cd .build
          tar -cf ${{ env.OUTPUT_BASE_NAME }}-source.tar ${{ env.OUTPUT_BASE_NAME }}
          gzip ${{ env.OUTPUT_BASE_NAME }}-source.tar

      - name: Create zip
        run: |
          cd .build
          zip -r ${{ env.OUTPUT_BASE_NAME }}-source.zip ${{ env.OUTPUT_BASE_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            .build/${{ env.OUTPUT_BASE_NAME }}-source.tar.gz
            .build/${{ env.OUTPUT_BASE_NAME }}-source.zip

  release:
    name: Create Release
    needs: [build, source, license]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          cd artifacts
          find . -mindepth 2 -type f -print0 | xargs -0 -I{} mv "{}" .
          find . -mindepth 1 -type d -empty -delete

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f -printf "%P\0" | sort -z | xargs -0 sha256sum >../SHA256SUMS
          mv ../SHA256SUMS .

      - name: Create GitHub Release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*

      - name: Upload artifacts for ACT testing
        if: ${{ env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: act-release-artifacts
          path: artifacts/*

  update-pkg-go-dev:
    name: Update pkg.go.dev
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Update pkg.go.dev
        if: ${{ !env.ACT }}
        run: curl https://sum.golang.org/lookup/github.com/ariaci/kopia-provisioner@${{ github.ref_name }}
